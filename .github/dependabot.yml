version: 2
# Every ecosystem runs on Monday. The cooldown skips releases younger than 3 days, which avoids
# yanked or quickly re-patched versions.
updates:
  # .NET / NuGet dependencies (Central Package Management)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    ignore:
      # ImageSharp 3.2 and 4.0 use the Six Labors Split License and their build targets fail
      # outright without a registered key ("No Six Labors license found ... obtain a license from
      # sixlabors.com/pricing"). Netdocs ships as a zero-config OSS binary, so it stays on the
      # Apache-2.0 3.1.x line -- see the pin in Directory.Packages.props. Drawing 2.2+ depends on
      # ImageSharp 3.2, so it carries the same constraint.
      # Without this, every ImageSharp release reopens a PR that cannot build.
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">= 3.2.0"]
      - dependency-name: "SixLabors.ImageSharp.Drawing"
        versions: [">= 2.2.0"]
    # Every package version lives in Directory.Packages.props, so separate PRs for overlapping
    # groups conflict with each other as soon as one merges. Two groups keep it to at most two
    # PRs a week: all minor and patch bumps together, and all major bumps together.
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # GitHub Actions workflow dependencies. Actions are bumped as one group across
  # all update types (including major) because action major bumps are frequent,
  # low-risk, and were previously opening a separate PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Front-end JS/CSS libraries loaded from a CDN, tracked via /package.json.
  # Dependabot flags new releases here; a maintainer then bumps the matching CDN
  # URL in the theme templates / plugins. See
  # docs-site/docs/development/frontend-dependencies.md.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend:
        patterns:
          - "*"

  # The local CMS admin app and in-page editor (src/Netdocs.Cms.Ui). A bump here needs
  # `npm run build` so the committed bundle in src/Netdocs.Cli/Cms/wwwroot matches; the CI
  # "CMS UI bundle" job fails until it does.
  - package-ecosystem: "npm"
    directory: "/src/Netdocs.Cms.Ui"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cms)"
    groups:
      cms-ui:
        patterns:
          - "*"
