version: 2
# Every ecosystem runs on Monday and groups its updates, so a week's bumps arrive as at most one
# PR per ecosystem. The cooldown skips releases younger than 3 days, which avoids yanked or
# quickly-patched versions.
updates:
  # .NET / NuGet dependencies (Central Package Management). Every bump edits
  # Directory.Packages.props, so separate PRs conflict with each other once one merges.
  # Minor and patch bumps share one PR; majors get their own.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    ignore:
      # From ImageSharp 3.2.0 / Drawing 2.2.0 the Six Labors Split License applies and the build
      # fails without a license key. Netdocs stays on the Apache-2.0 releases; see the pin in
      # Directory.Packages.props.
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">= 3.2.0"]
      - dependency-name: "SixLabors.ImageSharp.Drawing"
        versions: [">= 2.2.0"]
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Microsoft.Extensions.* majors follow the .NET release and move together.
      microsoft-extensions-major:
        patterns:
          - "Microsoft.Extensions.*"
        update-types:
          - "major"

  # GitHub Actions. All update types share one PR: action majors are frequent and low-risk.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Front-end JS/CSS libraries loaded from a CDN, tracked via /package.json.
  # Dependabot flags new releases here; a maintainer then bumps the matching CDN
  # URL in the theme templates / plugins. See
  # docs-site/docs/development/frontend-dependencies.md.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend:
        patterns:
          - "*"

  # The local CMS admin app and in-page editor (src/Netdocs.Cms.Ui). A bump here needs
  # `npm ci && npm run build` so the committed bundle in src/Netdocs.Cli/Cms/wwwroot matches;
  # the CI "CMS UI bundle" job fails until it does. All update types share one PR, since each
  # needs that rebuild anyway.
  - package-ecosystem: "npm"
    directory: "/src/Netdocs.Cms.Ui"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cms)"
    groups:
      cms-ui:
        patterns:
          - "*"
