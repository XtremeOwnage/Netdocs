name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Netdocs.slnx

      - name: Format check (lint)
        run: dotnet format Netdocs.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Netdocs.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Netdocs.slnx -c Release --no-build --verbosity normal

  cms-ui:
    name: CMS UI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Netdocs.Cms.Ui/package-lock.json

      - name: Build the admin app and in-page editor
        working-directory: src/Netdocs.Cms.Ui
        run: |
          npm ci
          npm run build

      - name: Check the committed bundle is up to date
        run: |
          git add -N src/Netdocs.Cli/Cms/wwwroot
          git diff --exit-code --stat -- src/Netdocs.Cli/Cms/wwwroot || {
            echo "::error::src/Netdocs.Cli/Cms/wwwroot is out of date. Run 'npm ci && npm run build' in src/Netdocs.Cms.Ui and commit the result."
            exit 1
          }
