name: Packages

on:
  push:
    # Only full semver tags publish release binaries. The moving `v1` alias tag
    # (used for `XtremeOwnage/Netdocs@v1`) must not create a stray `v1` release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (without leading v)
        required: false
        default: "0.0.0"
  # Build (but never publish) the packages when the packaging itself changes.
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/packages.yml"

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '0.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained binaries (linux, windows, macos)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for rid in linux-x64 win-x64 osx-x64 osx-arm64; do
            echo "::group::publish $rid"
            dotnet publish src/Netdocs.Cli -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true \
              -p:Version="${VERSION:-0.0.0}" -o "dist/$rid"
            echo "::endgroup::"
          done

      - name: Stage standalone executables
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out
          v="${VERSION:-0.0.0}"
          cp "dist/linux-x64/netdocs"      "out/netdocs-${v}-linux-x64"
          cp "dist/osx-x64/netdocs"        "out/netdocs-${v}-osx-x64"
          cp "dist/osx-arm64/netdocs"      "out/netdocs-${v}-osx-arm64"
          cp "dist/win-x64/netdocs.exe"    "out/netdocs-${v}-win-x64.exe"
          cp install/install.ps1           "out/install.ps1"
          cp install/uninstall.ps1         "out/uninstall.ps1"
          ls -l out

      - name: Install nfpm
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_$(uname -m)_Linux.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm || {
              go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
              echo "$HOME/go/bin" >> "$GITHUB_PATH"
            }

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out
          nfpm package -f packaging/nfpm.yaml -p deb -t out/
          nfpm package -f packaging/nfpm.yaml -p rpm -t out/
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: netdocs-packages
          path: out/*

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: out/*

  msi:
    # WiX needs Windows Installer, so the MSI is built on a Windows runner from the
    # win-x64 binary the job above already published.
    needs: packages
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      WIX_VERSION: "6.0.2"
      # Let the wix tool run on whichever newer .NET runtime the runner has.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: netdocs-packages
          path: out

      - name: Resolve version
        id: version
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '${{ github.event.inputs.version || '0.0.0' }}' }
          "value=$v" >> $env:GITHUB_OUTPUT

      # global.json pins the SDK, so `dotnet tool` needs that SDK installed here too.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix extension add --global "WixToolset.UI.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix --version

      - name: Build MSI
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # WixUI shows the license on its first page; render LICENSE as minimal RTF.
          $text = Get-Content LICENSE -Raw
          $sb = [System.Text.StringBuilder]::new('{\rtf1\ansi\deff0{\fonttbl{\f0 Segoe UI;}}\fs18 ')
          foreach ($ch in $text.ToCharArray()) {
            switch ($ch) {
              '\' { [void]$sb.Append('\\') }
              '{' { [void]$sb.Append('\{') }
              '}' { [void]$sb.Append('\}') }
              "`r" { }
              "`n" { [void]$sb.Append("\par`n") }
              default {
                if ([int]$ch -gt 127) { [void]$sb.Append("\u$([int]$ch)?") } else { [void]$sb.Append($ch) }
              }
            }
          }
          [void]$sb.Append('}')
          Set-Content -Path License.rtf -Value $sb.ToString() -Encoding ascii -NoNewline

          $msi = "out/netdocs-$env:VERSION-win-x64.msi"
          wix build packaging/msi/Netdocs.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d Version=$env:VERSION `
            -d SourceExe="out/netdocs-$env:VERSION-win-x64.exe" `
            -d LicenseRtf=License.rtf `
            -o $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item $msi

      - name: Smoke-test per-user and per-machine installs
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $msi = (Resolve-Path "out/netdocs-$env:VERSION-win-x64.msi").Path

          function Invoke-Msi([string[]]$msiArgs) {
            $p = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec $($msiArgs -join ' ') exited with $($p.ExitCode)" }
          }
          function Get-NetdocsPathEntry([string]$scope) {
            [Environment]::GetEnvironmentVariable('Path', $scope) -split ';' |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'netdocs.exe')) }
          }

          foreach ($case in @(
              @{ Name = 'per-user';    Scope = 'User';    Extra = @() },
              @{ Name = 'per-machine'; Scope = 'Machine'; Extra = @('ALLUSERS=1') })) {
            Write-Host "==> $($case.Name) install"
            Invoke-Msi (@('/i', "`"$msi`"", '/qn', '/l*v', "`"$($case.Name)-install.log`"") + $case.Extra)

            $dir = Get-NetdocsPathEntry $case.Scope
            if (-not $dir) { throw "netdocs was not added to the $($case.Scope) PATH" }
            Write-Host "Installed to $dir (on $($case.Scope) PATH)"
            & (Join-Path $dir 'netdocs.exe') --version
            if ($LASTEXITCODE) { throw "netdocs --version failed with $LASTEXITCODE" }

            Write-Host "==> $($case.Name) uninstall"
            Invoke-Msi (@('/x', "`"$msi`"", '/qn', '/l*v', "`"$($case.Name)-uninstall.log`"") + $case.Extra)
            if (Get-NetdocsPathEntry $case.Scope) { throw "PATH entry was not removed on uninstall" }
            if (Test-Path (Join-Path $dir 'netdocs.exe')) { throw "netdocs.exe was not removed on uninstall" }
          }

      - name: Upload install logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: "*.log"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: netdocs-msi
          path: out/*.msi

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.msi
